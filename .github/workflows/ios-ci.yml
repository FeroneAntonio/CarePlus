name: iOS build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project 'Care+/Care+.xcodeproj' -scheme 'Care+'

      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -project 'Care+/Care+.xcodeproj'
          -scheme 'Care+'
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
